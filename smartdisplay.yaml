interval:
  - interval: 1s
    then:
      # UI updates only when screen ON
      - if:
          condition:
            lambda: 'return id(screen_is_on);'
          then:
            - if: # check ha connection
                condition:
                  lambda: 'return !id(ha_connected);'
                then:
                  - lambda: |-
                      static bool visible = true;
                      visible = !visible;
                      id(ha_logo_visible) = visible;
                  - lvgl.label.update:
                      id: ha_logo
                      text_color: red
                      hidden: !lambda 'return !id(ha_logo_visible);'
                else:
                  - lvgl.label.update:
                      id: ha_logo
                      hidden: false
                      text_color: $COLOR_1

      # script to lock the screen
      - lambda: |-
          if (!id(screen_is_on)) return;  // ✅ STOP everything if already off

          float timeout_sec = id(screen_timeout).state;

          uint32_t timeout_ms = uint32_t(timeout_sec * 1000);

          if (millis() - id(last_touch_ms) > timeout_ms) {
            ESP_LOGI("screen", "⏳ Timeout reached -> turning screen OFF");
            id(screen_off).execute();
          }          

binary_sensor:
  - platform: status
    name: "Device Status"

sensor:
  - platform: adc
    pin: GPIO35
    name: "Battery Voltage"
    id: batt_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 1min
    on_value:
      then:
        # - lambda: |-
        #       ESP_LOGI("battery", "Voltage=%.3fV", x);
        - component.update: batt_level
    on_value_range:
      - below: 3.19
        then:
          - deep_sleep.enter:
              id: night_sleep
              sleep_duration: 30d  # '30d' forces the ESP32 to sleep 30 days.
    filters:
      # - lambda: |-
      #         ESP_LOGI("battery", "RAW ADC=%.3fV", x);
      #         return x;
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      - calibrate_linear:
          method: exact
          datapoints:
            - 1.585 -> 3.17 # Point 1: Empty
            - 1.626 -> 3.22
            - 1.700 -> 3.36
            - 1.718 -> 3.40
            - 1.786 -> 3.44
            - 1.796 -> 3.50
            - 1.812 -> 3.60
            - 1.866 -> 3.70
            - 1.903 -> 3.80
            - 1.951 -> 3.90
            - 2.017 -> 4.00
            - 2.069 -> 4.10
            - 2.076 -> 4.15
            - 2.125 -> 4.24  # Point 5: Full
  - platform: template
    name: "Battery Level"
    id: batt_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      auto v = id(batt_voltage).state;

      if (std::isnan(v)) {
        return {};
      }
      
      // ===== CONFIG (Tuned for standard 3.7V Li-ion) =====
      const float VMAX  = 4.24;   // 100%: Fully charged
      const float VHIGH = 3.95;   //  75%: Top drop-off
      const float VMID  = 3.75;   //  50%: Middle of the flat plateau
      const float VLOW  = 3.50;   //  15%: Bottom of plateau, about to drop fast
      const float VMIN  = 3.20;   //   0%: Electronics brown-out point
      
      float percent = 0.0;

      // ===== LOGIC =====
      if (v >= VMAX) percent = 100.0;
      else if (v <= VMIN) percent = 0.0;
      else if (v >= VHIGH) percent = 75.0 + (v - VHIGH) * (25.0 / (VMAX - VHIGH));
      else if (v >= VMID) percent = 50.0 + (v - VMID) * (25.0 / (VHIGH - VMID));
      else if (v >= VLOW) percent = 15.0 + (v - VLOW) * (35.0 / (VMID - VLOW));
      else percent = (v - VMIN) * (15.0 / (VLOW - VMIN));

      // Round to 1 decimal place before passing to Home Assistant
      return roundf(percent * 10.0) / 10.0;
    on_value:
      then:
        - lvgl.arc.update:
            id: battery_arc
            value: !lambda 'return x;'
            indicator:
              arc_color: !lambda |-
                if (x >= 80) return lv_color_hex(0x00FF00); // green
                if (x >= 50) return lv_color_hex(0x0000FF); // blue 
                if (x >= 15) return lv_color_hex(0xFFFF00); // yellow
                return lv_color_hex(0xFF0000); // red
        - lvgl.label.update:
            id: battery_label
            text: !lambda |-
              char buff[8];
              sprintf(buff, "%.0f", x);
              return std::string(buff);

  - platform: homeassistant
    id: media_volume
    entity_id: $MEDIA_PLAYER
    attribute: volume_level
    on_value:
      - script.execute: center_screen_volume

  - platform: homeassistant
    id: weather_temperature
    entity_id: $WEATHER
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: weather_temp_label
          text: !lambda |-
            char buff[10];
            sprintf(buff, "%.1f°C", x);;            
            return std::string(buff);    

  - platform: homeassistant
    id: air_quality_index
    entity_id: $AIR_QUALITY
    on_value:
      - lambda: |-
          ESP_LOGI("aqi", "AQI value: %.0f", x);
      - lvgl.label.update:
          id: aqi_label
          text: !lambda |-
            char buff[10];
            sprintf(buff, "%.0f", x);
            return std::string(buff);
      - lvgl.obj.update:
          id: air_quality_icon
          bg_color: !lambda |-
            if (x <= 50) return lv_color_hex(0x00E400);      // good (green)
            if (x <= 100) return lv_color_hex(0xFFFF00);     // moderate (yellow)
            if (x <= 150) return lv_color_hex(0xFF7E00);     // unhealthy for sensitive
            if (x <= 200) return lv_color_hex(0xFF0000);     // unhealthy
            if (x <= 300) return lv_color_hex(0x99004C);     // very unhealthy
            return lv_color_hex(0x7E0023);                   // hazardous
          border_color:
            !lambda |-
            if (x <= 50) return lv_color_hex(0x00E400);      // good (green)
            if (x <= 100) return lv_color_hex(0xFFFF00);     // moderate (yellow)
            if (x <= 150) return lv_color_hex(0xFF7E00);     // unhealthy for sensitive
            if (x <= 200) return lv_color_hex(0xFF0000);     // unhealthy
            if (x <= 300) return lv_color_hex(0x99004C);     // very unhealthy
            return lv_color_hex(0x7E0023);                   // hazardous     

  - platform: homeassistant
    id: weather_wind_speed
    entity_id: $WEATHER
    attribute: wind_speed
    on_value:
      - lambda: |-
          ESP_LOGI("weather", "Wind speed: %.1f", x);
      - lvgl.label.update:
          id: wind_label
          text: !lambda |-
            char buff[16];
            sprintf(buff, "%.0f", x);
            return std::string(buff);

  - platform: homeassistant
    id: weather_wind_bearing
    entity_id: $WEATHER
    attribute: wind_bearing
    on_value:
      - lvgl.image.update:
          id: wind_arrow_img
          rotation: !lambda |-
            float deg = x + 90.0;
            if (deg >= 360.0) deg -= 360.0;
            if (deg < 0.0) deg += 360.0;

            return int(deg * 10);  // LVGL uses 0.1° units
  # --- AC Tracked Sensors ---
  - platform: homeassistant
    id: ac_current_temp
    entity_id: $CLIMATE
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: temperature_home_label
          text: !lambda |-
            char buff[12];
            sprintf(buff, "%.0f°", x);
            return std::string(buff);

  - platform: homeassistant
