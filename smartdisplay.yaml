esphome:
  name: smart-display
  friendly_name: SmartDisplay
  platformio_options:
    board_build.f_cpu: 160000000L # Drops CPU to 160MHz
  on_boot:
    - priority: 800 # Run this extremely early
      then:
        - output.turn_off: cyd_red
        - output.turn_off: cyd_green
        - output.turn_off: cyd_blue
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: ${BRIGHTNESS}%
        - lambda: |-
            id(last_touch_ms) = millis();    

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: 3.1
      sram1_as_iram: true

logger:
  level: ERROR
  baud_rate: 0

# logger:
#   level: DEBUG

api:
  encryption:
    key: "uQ0fPZIzgmgMjoDOUVFR5cVwwuX2BMpkvkfAX0cdZCU="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light

  ap:
    ssid: "SmartDisplayHotspot"
  on_connect:
    - lambda: |-
        id(ha_connected) = true;
    - script.execute: time_update
  on_disconnect:
    - lambda: |-
        id(ha_connected) = false;

captive_portal:

