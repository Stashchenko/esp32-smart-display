          - label:
              id: center_screen_label
              translate_x: 25
              translate_y: 6
              text_font: bebas_big
              text_color: 0xFFFFFF
              text: "--"

    - obj:
        id: touch_overlay
        width: 320
        height: 240
        align: CENTER

        bg_color: 0x000000
        bg_opa: 100%          # 100% dark overlay

        border_width: 0
        radius: 0
        hidden: true         # start hidden (screen ON)
        clickable: false      # MUST capture touch
        scrollable: false

        widgets:
          - label:
              align: CENTER
              text: "TAP TO UNLOCK"
              text_font: roboto
              text_color: 0x212121
        on_click:
          - light.turn_on:
              id: backlight
              brightness: ${BRIGHTNESS}%
          - lambda: |-
              id(last_touch_ms) = millis();  // reset timer on wake
          - lvgl.obj.update:
              id: touch_overlay
              hidden: true

    - obj:
        id: notification_popup
        width: 280
        height: 100
        align: TOP_LEFT
        translate_x: 20          # move right to center horizontally
        translate_y: 3           # distance from top
        radius: 10
        hidden: true
        clickable: true
        scrollable: true
        scroll_dir: VER
        bg_color: $COLOR_1
        border_color: $COLOR_1
        border_width: 0
        widgets:
          - label:
              id: notification_label
              align: CENTER
              width: 260
              text: ""
              text_font: roboto_big
              text_color: 0xFFFFFF
              long_mode: WRAP
        on_click:
          - script.execute: dismiss_notification
        on_press:
          - lambda: |-
              id(touch_start_y) = point.y;
        on_release:
          - lambda: |-
              // Swipe up: difference between starting Y and release Y exceeds threshold (e.g., 30 pixels)
              if (id(touch_start_y) - point.y > 30) {
                id(dismiss_notification).execute();
              }
