    on_value:
      - script.execute: center_screen_ac_temp
      - lvgl.label.update:
          id: temperature_target_label
          text: !lambda |-
            char buff[12];
            sprintf(buff, "%.0f°", x);
            return std::string(buff); 

text_sensor:
  - platform: homeassistant
    id: media_title
    entity_id: $MEDIA_PLAYER
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: media_label
          text: !lambda |-
            if (x.length() > 0) return x.c_str();
            return "No media";

  - platform: homeassistant
    id: media_state
    entity_id: $MEDIA_PLAYER
    on_value:
      - lvgl.label.update:
          id: play_btn_label
          text: !lambda |-
            if (x == "playing") return "\U000F03E4"; // pause
            return "\U000F040A"; // play

  - platform: homeassistant
    id: weather_condition
    entity_id: $WEATHER
    on_value:
      - lvgl.image.update:
          id: weather_icon_img
          src: !lambda |-
            // Convert x (state) to image ID
            std::string s = x;        
            
            if (s == "clear-night") return id(clearnight);
            if (s == "cloudy") return id(cloudy);
            if (s == "fog") return id(fog);
            if (s == "hail") return id(hail);
            if (s == "lightning") return id(lightning);
            if (s == "lightning-rainy") return id(lightningrainy);
            if (s == "partlycloudy") return id(partlycloudy);
            if (s == "pouring") return id(pouring);
            if (s == "rainy") return id(rainy);
            if (s == "snowy") return id(snowy);
            if (s == "snowy-rainy") return id(snowyrainy);
            if (s == "sunny") return id(sunny);
            if (s == "windy") return id(windy);
            if (s == "windy-variant") return id(windyvariant);
            if (s == "exceptional") return id(exceptional);
            
            return id(initial);

    # --- AC Tracked Text Sensor with Dynamic Button Color Styling ---
  # AC hvac mode
  - platform: homeassistant
    id: ac_hvac_mode
    entity_id: $CLIMATE
    on_value:
      then:
        - lvgl.dropdown.update:
            id: ac_mode_dropdown
            selected_index: !lambda |-
              if (x == "off") return 0;
              if (x == "cool") return 1;
              if (x == "heat") return 2;
              if (x == "dry") return 3;
              return 0;

select:
  - platform: template
    name: "Melody"
    id: notify_melody
    icon: "mdi:music-note"
    optimistic: true
    options:
      - nokia_pop
      - scale_up
      - two_short
      - siren
      - star_wars
      - mission_imp
      - mario
    initial_option: nokia_pop

  - platform: lvgl
    widget: ac_mode_dropdown
    id: ac_mode_selector
    name: "AC Mode Selector"
    internal: true
    on_value:
      then:
        - homeassistant.action:
            action: climate.set_hvac_mode
            data:
              entity_id: $CLIMATE
              hvac_mode: !lambda |-
                if (x == "\U000F001B") return "off";
                if (x == "\U000F0717") return "cool";
                if (x == "\U000F0238") return "heat";
                if (x == "\U000F058E") return "dry";
                return "off";

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    icon: "mdi:brightness-6"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(screen_is_on) = true;          
          ESP_LOGI("screen", "☀️ Backlight ON → reset timer");

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: my_display
    model: ESP32-2432S028-9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: rgb            # Match the lowercase requirement for mipi_spi
    color_depth: 16             # Upgrade to crisp 16-bit color depth
    auto_clear_enabled: false   # Required to let LVGL handle rendering
    update_interval: never      # Required to let LVGL handle rendering


touchscreen:
  platform: xpt2046
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 250ms
  threshold: 400
  calibration:
    x_min: 240
    x_max: 3750
    y_min: 290
    y_max: 3750
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true
  on_touch:
    - lambda: |-
        if (!id(screen_is_on)) {
          ESP_LOGI("screen", "👆 Wake screen");
          id(screen_on).execute();
        }
        id(last_touch_ms) = millis();

